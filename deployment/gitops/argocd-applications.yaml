apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: safwaan-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/safwaan-ai-studio
    targetRevision: HEAD
    path: deployment/kubernetes
    kustomize:
      commonLabels:
        app.kubernetes.io/managed-by: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: safwaan
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true

