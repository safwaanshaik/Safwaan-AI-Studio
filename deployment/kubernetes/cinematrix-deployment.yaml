apiVersion: apps/v1
kind: Deployment
metadata:
  name: safwaan-backend
  namespace: safwaan
  labels:
    app: safwaan-backend
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: safwaan-backend
  template:
    metadata:
      labels:
        app: safwaan-backend
        component: backend
    spec:
      containers:
      - name: backend
        image: safwaan/safwaan-backend:2.0.0
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: secret-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp
      volumes:
      - name: temp-storage
        emptyDir: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safwaan-frontend
  namespace: safwaan
  labels:
    app: safwaan-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safwaan-frontend
  template:
    metadata:
      labels:
        app: safwaan-frontend
        component: frontend
    spec:
      containers:
      - name: frontend
        image: safwaan/safwaan-frontend:2.0.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: REACT_APP_API_URL
          value: "http://safwaan-backend-service.safwaan.svc.cluster.local:8000/api/v1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safwaan-worker
  namespace: safwaan
  labels:
    app: safwaan-worker
    component: worker
    type: video-pipeline
spec:
  replicas: 6
  selector:
    matchLabels:
      app: safwaan-worker
  template:
    metadata:
      labels:
        app: safwaan-worker
        component: worker
        type: video-pipeline
    spec:
      nodeSelector:
        safwaan.ai/node-type: gpu
      containers:
      - name: worker
        image: safwaan/safwaan-worker:2.0.0
        command: ["celery", "-A", "workers.celery_app", "worker", "--loglevel=info", "--concurrency=3"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: secret-key
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp
        - name: model-cache
          mountPath: /app/models
      volumes:
      - name: temp-storage
        emptyDir: {}
      - name: model-cache
        persistentVolumeClaim:
          claimName: model-cache-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safwaan-workflow
  namespace: safwaan
  labels:
    app: safwaan-workflow
    component: n8n
spec:
  replicas: 2
  selector:
    matchLabels:
      app: safwaan-workflow
  template:
    metadata:
      labels:
        app: safwaan-workflow
        component: n8n
    spec:
      nodeSelector:
        safwaan.ai/capability: n8n
      containers:
      - name: workflow
        image: safwaan/safwaan-workflow:2.0.0
        ports:
        - containerPort: 5678
          name: http
        env:
        - name: DB_TYPE
          value: "postgresdb"
        - name: DB_POSTGRESDB_HOST
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: db-host
        - name: DB_POSTGRESDB_DATABASE
          value: "safwaan"
        - name: DB_POSTGRESDB_USER
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: db-user
        - name: DB_POSTGRESDB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: safwaan-secrets
              key: db-password
        - name: WEBHOOK_URL
          value: "https://workflow.safwaan.ai"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5678
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: workflow-storage
          mountPath: /home/node/.n8n
      volumes:
      - name: workflow-storage
        persistentVolumeClaim:
          claimName: workflow-storage-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: safwaan-backend-service
  namespace: safwaan
spec:
  selector:
    app: safwaan-backend
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: safwaan-frontend-service
  namespace: safwaan
spec:
  selector:
    app: safwaan-frontend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: safwaan-workflow-service
  namespace: safwaan
spec:
  selector:
    app: safwaan-workflow
  ports:
  - port: 5678
    targetPort: 5678
    protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: safwaan-ingress
  namespace: safwaan
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - safwaan.ai
    - api.safwaan.ai
    - workflow.safwaan.ai
    secretName: safwaan-tls
  rules:
  - host: safwaan.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: safwaan-frontend-service
            port:
              number: 3000
  - host: api.safwaan.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: safwaan-backend-service
            port:
              number: 8000
  - host: workflow.safwaan.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: safwaan-workflow-service
            port:
              number: 5678

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache-pvc
  namespace: safwaan
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workflow-storage-pvc
  namespace: safwaan
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard